<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark container for crisp tab contrast in both light and dark browser themes -->
  <rect width="64" height="64" rx="16" fill="#090a0f" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
  
  <g transform="translate(8, 8)">
    <!-- Outer Hex-Chamfered Solar Shield -->
    <polygon 
      points="24,3 41,12 41,36 24,45 7,36 7,12" 
      stroke="#f59e0b" 
      stroke-opacity="0.5"
      stroke-width="2.2" 
      stroke-linejoin="miter"
      fill="none"
    />
    <!-- Inner Geometric Solar Drip Blade -->
    <path 
      d="M24 9L34 14.5V20L28 23L34 26.5V33.5L24 39L14 33.5V28L20 25L14 21.5V14.5L24 9Z" 
      fill="#f59e0b" 
