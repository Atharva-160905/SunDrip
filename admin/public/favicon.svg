    />
    <!-- Core Vertical Iron Spine Line -->
    <path 
      d="M24 13V35" 
      stroke="#ffffff" 
      stroke-width="2.8" 
      stroke-linecap="square"
    />
    <!-- Dynamic Chevron Slits -->
    <path 
      d="M19 17L24 20L29 17" 
      stroke="#ffffff" 
      stroke-width="2.2" 
      stroke-linecap="square"
      fill="none"
    />
    <path 
      d="M19 28L24 31L29 28" 
